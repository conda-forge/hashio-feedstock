{% set name = "hashio" %}
{% set version = "0.5.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 693f53be178f9681d54de443321b4f69edac41c5f12910d6d3addab16a6ac591

build:
  noarch: python
  number: 0
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - hashio=hashio.cli:main

requirements:
  host:
    - python {{ python_min }}
    - setuptools
    - pip
  run:
    - python >={{ python_min }}
    - lxml ==5.3.0
    - tqdm ==4.67.1
    - python-xxhash ==3.5.0

test:
  imports:
    - hashio
  commands:
    - hashio -h
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Custom file and directory checksum tool
  home: http://github.com/rsgalloway/hashio
  dev_url: http://github.com/rsgalloway/hashio
  license: BSD 3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rsgalloway
