{% set name = "hashio" %}
{% set version = "0.5.3" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7f80fa68f7257a399fbc2fa6b618d1ec3871ac2d4a21705f29c334828a825172

build:
  number: 0
  script:
    - {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - hashio=hashio.cli:main

requirements:
  host:
    - python
    - setuptools >=61
    - wheel
    - pip
  run:
    - python
    - lxml ==5.4.0  # [py<314]
    - lxml ==6.0.4  # [py>=314]
    - tqdm ==4.67.1
    - python-xxhash ==3.5.0

test:
  imports:
    - hashio
  commands:
    - hashio -h
    - pip check
  requires:
    - pip

about:
  summary: Custom file and directory checksum tool
  home: http://github.com/rsgalloway/hashio
  dev_url: http://github.com/rsgalloway/hashio
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rsgalloway
